name: Salesforce Automation System
description: >-
  Salesforce Automation System refers to the collection of APIs and tools
  within Salesforce for automating business processes, including Sales Cloud
  automation, Flow automation, Process Builder, and Workflow Rules. These
  capabilities enable organizations to automate CRM, sales, marketing, and
  customer service workflows programmatically.
