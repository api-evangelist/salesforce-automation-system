naftiko: 1.0.0-alpha2
info:
  label: Salesforce Flow Automation API — Process Automation
  description: 'Salesforce Flow Automation API — Process Automation. 3 operations. Lead operation: List Approval Processes.
    Self-contained Naftiko capability covering one Salesforce Automation System business surface.'
  tags:
  - Salesforce Automation System
  - Process Automation
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_AUTOMATION_SYSTEM_API_KEY: SALESFORCE_AUTOMATION_SYSTEM_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-automation-flow-process-automation
    baseUri: https://{instance}.salesforce.com/services/data/v59.0
    description: Salesforce Flow Automation API — Process Automation business capability. Self-contained, no shared references.
    resources:
    - name: process-approvals
      path: /process/approvals
      operations:
      - name: listapprovalprocesses
        method: GET
        description: List Approval Processes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: submitapprovalrequest
        method: POST
        description: Submit Approval Request
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: query
      path: /query
      operations:
      - name: soqlquery
        method: GET
        description: Execute SOQL Query
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: q
          in: query
          type: string
          description: SOQL query string.
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_AUTOMATION_SYSTEM_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-automation-flow-process-automation-rest
    port: 8080
    description: REST adapter for Salesforce Flow Automation API — Process Automation. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/process/approvals
      name: process-approvals
      description: REST surface for process-approvals.
      operations:
      - method: GET
        name: listapprovalprocesses
        description: List Approval Processes
        call: salesforce-automation-flow-process-automation.listapprovalprocesses
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: submitapprovalrequest
        description: Submit Approval Request
        call: salesforce-automation-flow-process-automation.submitapprovalrequest
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/query
      name: query
      description: REST surface for query.
      operations:
      - method: GET
        name: soqlquery
        description: Execute SOQL Query
        call: salesforce-automation-flow-process-automation.soqlquery
        with:
          q: rest.q
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-automation-flow-process-automation-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Flow Automation API — Process Automation. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: list-approval-processes
      description: List Approval Processes
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-automation-flow-process-automation.listapprovalprocesses
      outputParameters:
      - type: object
        mapping: $.
    - name: submit-approval-request
      description: Submit Approval Request
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesforce-automation-flow-process-automation.submitapprovalrequest
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: execute-soql-query
      description: Execute SOQL Query
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-automation-flow-process-automation.soqlquery
      with:
        q: tools.q
      outputParameters:
      - type: object
        mapping: $.
